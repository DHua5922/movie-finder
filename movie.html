<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search for movies and filter them by title or release date."
    />

    <title>Movies</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/movie.css" />

    <!-- FONT AWESOME ICONS -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html" class="focus-ring-dark">
          <figure class="nav__logo--wrapper">
            <img
              src="./assets/logo-brand.svg"
              alt="Logo"
              class="nav__logo--img"
            />
          </figure>
        </a>

        <button
          aria-label="expand / collapse links on mobile screen"
          class="cursor-pointer nav__expand-mobile-links-button text-dark focus-ring-dark btn-transparent"
        >
          <i class="fa-solid fa-bars"></i>
        </button>

        <ul class="nav__links--desktop">
          <li>
            <a href="index.html" class="nav__link text-dark focus-ring-dark"
              >Home</a
            >
          </li>
          <li>
            <a href="cart.html" class="nav__link text-dark focus-ring-dark"
              >Cart</a
            >
          </li>
          <li>
            <a
              href="search-movies.html"
              class="nav__link btn btn-dark focus-ring-dark"
              >Find Movies</a
            >
          </li>
          <li>
            <button
              class="btn-transparent nav__theme-toggle-btn focus-ring-dark"
              aria-label="Toggle light/dark theme"
            >
              <i
                class="text-dark fa-solid fa-circle-half-stroke nav__theme-icon"
              ></i>
            </button>
          </li>
        </ul>
      </nav>

      <div class="nav__links--mobile-wrapper">
        <ul class="nav__links--mobile">
          <li>
            <a href="index.html" class="nav__link text-dark focus-ring-dark"
              >Home</a
            >
          </li>
          <li>
            <a href="cart.html" class="nav__link text-dark focus-ring-dark"
              >Cart</a
            >
          </li>
          <li>
            <a
              href="search-movies.html"
              class="nav__link btn btn-dark btn-link focus-ring-dark"
              >Find Movies</a
            >
          </li>
          <li>
            <button
              class="nav__theme-toggle-btn btn-transparent text-dark focus-ring-dark cursor-pointer"
              aria-label="Toggle light/dark theme"
            >
              Light/Dark Mode
            </button>
          </li>
        </ul>
      </div>
    </header>

    <main>
      <section class="container">
        <button
          class="flex back-link btn-transparent text-dark focus-ring-dark"
        >
          <i class="fa-solid fa-arrow-left-long"></i>
          Back
        </button>

        <div class="flex flex-column align-items-center movie__container">
          <figure class="movie__image--wrapper"></figure>
          <div class="movie__details flex flex-column align-items-center"></div>
        </div>

        <figure class="movie__video--wrapper"></figure>
      </section>
    </main>

    <footer>
      <div class="container footer__container">
        <a href="index.html" class="focus-ring-light">
          <figure class="nav__logo--wrapper">
            <img
              src="./assets/logo-brand.svg"
              alt="Logo"
              class="nav__logo--img"
            />
          </figure>
        </a>

        <hr class="divider-line footer__divider-line" />

        <p class="text-light footer__copyright">
          &copy; 2024 Movies. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/movie.js" defer></script>
    <script src="js/api.js" defer></script>
    <script src="js/utilities.js" defer></script>
  </body>
</html>
