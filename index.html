<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movies</title>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Custom JavaScript -->
    <script src="index.js" defer></script>
  </head>
  <body>
    <section id="header-section">
      <div class="overlay movie-bg"></div>

      <nav>
        <figure class="nav__logo--wrapper">
          <img
            src="./assets/logo-brand.svg"
            alt="Logo"
            class="nav__logo--img"
          />
        </figure>

        <ul class="nav__link--list">
          <li><a href="#" class="nav__link text-white">Home</a></li>
          <li>
            <a href="#" class="nav__link btn btn-primary no-click">Contact</a>
          </li>
        </ul>
      </nav>

      <header class="header__container container">
        <h1 class="header__title">Search Movies</h1>

        <form class="header__form" onsubmit="searchAndRenderMovies(event)">
          <input
            type="text"
            placeholder="Search for a movie..."
            class="header__input"
          />
        </form>
      </header>
    </section>

    <section id="movies-section">
      <main>
        <div class="movies__container container">
          <div class="movies__filter">
            <h2 class="text-primary movies__results--label">Search Results:</h2>
            <select class="text-primary" onchange="filterMovies(event)">
              <option value="">-- Choose Filter --</option>
              <option value="alphabetical">Alphabetical A to Z</option>
              <option value="reverse-alphabetical">Alphabetical Z to A</option>
              <option value="newest">Newest to oldest</option>
              <option value="oldest">Oldest to newest</option>
            </select>
          </div>

          <div class="movies__list"></div>
        </div>
      </main>
    </section>

    <footer>
      <div class="container footer__container">
        <figure class="nav__logo--wrapper">
          <img
            src="./assets/logo-brand.svg"
            alt="Logo"
            class="nav__logo--img"
          />
        </figure>

        <hr class="divider-line footer__divider-line" />

        <p class="text-white footer__copyright">
          &copy; 2024 Movies. All rights reserved.
        </p>
      </div>
    </footer>
  </body>
</html>
