<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Search for movies and filter them by title or release date."
    />

    <title>Movies</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/index.css" />

    <!-- FONT AWESOME ICONS -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <main>
      <section class="relative">
        <div class="overlay movie-bg"></div>

        <nav>
          <figure class="nav__logo--wrapper">
            <img
              src="./assets/logo-brand.svg"
              alt="Logo"
              class="nav__logo--img"
            />
          </figure>

          <ul class="nav__links">
            <li>
              <a href="index.html" class="nav__link text-light focus-ring-light"
                >Home</a
              >
            </li>
            <li>
              <a href="cart.html" class="nav__link text-light focus-ring-light"
                >Cart</a
              >
            </li>
            <li>
              <a
                href="search-movies.html"
                class="nav__link btn btn-light btn-link focus-ring-light"
                >Find Movies</a
              >
            </li>
            <li>
              <button
                class="btn-transparent nav__theme-toggle-btn focus-ring-light"
                aria-label="Toggle light/dark theme"
              >
                <i
                  class="text-light fa-solid fa-circle-half-stroke nav__theme-icon"
                ></i>
              </button>
            </li>
          </ul>
        </nav>

        <div class="container flex flex-column hero__content">
          <h1 class="text-center text-light hero__title">Search Movies</h1>
          <p class="text-center text-light hero__description">
            Find your favorite movies and explore new ones.
          </p>
          <div class="justify-content-center flex">
            <a
              href="search-movies.html"
              class="btn btn-light btn-link focus-ring-light"
              >Find Movies</a
            >
          </div>
        </div>
      </section>

      <section id="trending-movies-section">
        <div class="container">
          <h2 class="text-light">Trending Now</h2>
          <ul class="carousel"></ul>
        </div>
      </section>
    </main>

    <footer>
      <div class="container footer__container">
        <figure class="nav__logo--wrapper">
          <img
            src="./assets/logo-brand.svg"
            alt="Logo"
            class="nav__logo--img"
          />
        </figure>

        <hr class="divider-line footer__divider-line" />

        <p class="text-light footer__copyright">
          &copy; 2024 Movies. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/index.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utilities.js"></script>
  </body>
</html>
