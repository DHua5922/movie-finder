<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Checkout page for movies. Review your order and complete the purchase process."
    />

    <title>Movies</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/utilities.css" />
    <link rel="stylesheet" href="css/checkout.css" />

    <!-- FONT AWESOME ICONS -->
    <script
      src="https://kit.fontawesome.com/8700864f26.js"
      crossorigin="anonymous"
      defer
    ></script>
  </head>
  <body>
    <nav>
      <figure class="nav__logo--wrapper">
        <img src="./assets/logo-brand.svg" alt="Logo" class="nav__logo--img" />
      </figure>

      <ul class="nav__links">
        <li>
          <a href="index.html" class="nav__link text-dark focus-ring-dark"
            >Home</a
          >
        </li>
        <li>
          <a href="cart.html" class="nav__link text-dark focus-ring-dark"
            >Cart</a
          >
        </li>
        <li>
          <a
            href="search-movies.html"
            class="nav__link btn btn-dark focus-ring-dark"
            >Find Movies</a
          >
        </li>
      </ul>
    </nav>

    <main>
      <section class="container">
        <button
          class="flex back-link btn-transparent text-dark focus-ring-dark"
        >
          <i class="fa-solid fa-arrow-left-long"></i>
          Back
        </button>

        <div class="card">
          <form>
            <div class="form-group">
              <label for="name-input" class="form-label required">Name</label>
              <input
                id="name-input"
                type="text"
                placeholder="Name"
                required
                aria-describedby="name-error-message"
              />
              <p id="name-error-message" class="form-error-msg"></p>
            </div>

            <div class="form-group">
              <label for="email-input" class="form-label required">Email</label>
              <input
                id="email-input"
                type="email"
                placeholder="Email"
                required
                aria-describedby="email-error-message"
              />
              <p id="email-error-message" class="form-error-msg"></p>
            </div>
          </form>

          <ul class="cart-items"></ul>

          <div class="flex justify-content-center cart__checkout-btn--wrapper">
            <button class="btn btn-dark focus-ring-dark cart__checkout-btn">
              Confirm Selection
            </button>
          </div>
        </div>
      </section>

      <dialog autofocus aria-label="Confirmation Dialog" class="text-center">
        <div class="success-msg text-center">Thanks for Confirming!</div>
        <a href="index.html" class="success-btn btn">Back to Home</a>
      </dialog>
    </main>

    <footer>
      <div class="container footer__container">
        <figure class="nav__logo--wrapper">
          <img
            src="./assets/logo-brand.svg"
            alt="Logo"
            class="nav__logo--img"
          />
        </figure>

        <hr class="divider-line footer__divider-line" />

        <p class="text-light footer__copyright">
          &copy; 2024 Movies. All rights reserved.
        </p>
      </div>
    </footer>

    <!-- JavaScript -->
    <script src="js/checkout.js"></script>
    <script src="js/utilities.js"></script>
  </body>
</html>
